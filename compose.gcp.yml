name: voice-agent

x-application: &application
  image: voice-agent:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - private

services:
  api:
    <<: *application
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: sqlite+aiosqlite:////app/data/voice_agent.db
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    <<: *application
    command:
      - python
      - -m
      - backend.voice_agent
      - start
    environment:
      APP_ENVIRONMENT: production
      BACKEND_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  app_data:

networks:
  private:
    driver: bridge
