name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the GCP VM after checks pass
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: voice-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend --config backend/ruff.toml

      - name: Unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull --tag voice-agent:${{ github.sha }} .

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: docker
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_GCP == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true')

    steps:
      - name: Configure SSH
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_SSH_KEY: ${{ secrets.GCP_VM_SSH_KEY }}
        run: |
          : "${GCP_VM_HOST:?Missing GitHub Actions secret: GCP_VM_HOST}"
          : "${GCP_VM_SSH_KEY:?Missing GitHub Actions secret: GCP_VM_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GCP_VM_SSH_KEY" > ~/.ssh/voice_agent_vm
          chmod 600 ~/.ssh/voice_agent_vm
          ssh-keyscan -H "$GCP_VM_HOST" >> ~/.ssh/known_hosts

      - name: Pull and restart containers
        env:
          GCP_VM_HOST: ${{ secrets.GCP_VM_HOST }}
          GCP_VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_VM_APP_DIR: ${{ vars.GCP_VM_APP_DIR || '~/voice_agent' }}
        run: |
          : "${GCP_VM_USER:?Missing GitHub Actions secret: GCP_VM_USER}"
          ssh -i ~/.ssh/voice_agent_vm "$GCP_VM_USER@$GCP_VM_HOST" "cd $GCP_VM_APP_DIR && git pull --ff-only && sudo docker compose --env-file backend/.env -f compose.gcp.yml up -d --build --remove-orphans && sudo docker image prune -f"
